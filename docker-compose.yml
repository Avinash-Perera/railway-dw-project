services:
  # ---------------------------------------------------------------------------
  # MySQL 8.0 OLAP Data Warehouse Service
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: railway_dw_mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: dw_password
      MYSQL_DATABASE: railway_dw
    ports:
      - "3306:3306"
    volumes:
      # Persistent storage for MySQL data files
      - mysql_dw_data:/var/lib/mysql
      # Auto-executes SQL scripts in order (01 -> 02 -> 03) on first container startup
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdw_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Metabase Open-Source Business Intelligence & Analytics Dashboard
  # Access in browser at: http://localhost:3000
  # ---------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: railway_bi_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      mysql:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Optional: Containerized ETL Runner (run via: docker compose run --rm etl)
  # ---------------------------------------------------------------------------
  etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: railway_dw_etl
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: dw_password
      MYSQL_DB: railway_dw
    volumes:
      - ./data:/app/data
      - ./etl:/app/etl
    profiles:
      - tools

volumes:
  mysql_dw_data:
    driver: local
  metabase_data:
    driver: local
